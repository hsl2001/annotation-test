[project]
name = "playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hyunsu Lim", email = "thehyunsulim@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
playground = "playground:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
